name: agent-fixture-workflow
version: "1"
steps:
  - id: triage
    agent:
      prompt: { inline: "Triage this issue and produce a structured summary." }
      schema:
        inline:
          type: object
          properties:
            summary: { type: string }
            confidence: { type: number }
          required: [summary, confidence]
    produces: triage

  - id: plan
    agent:
      prompt: { file: ".yak/prompts/plan.md" }
      schema:
        inline:
          type: object
          properties:
            summary: { type: string }
            steps: { type: array, items: { type: string } }
          required: [summary, steps]
      context: { inherit: [triage] }
    produces: plan

  - id: check
    needs: [plan]
    command: { run: "echo checked", capture: [stdout, exitCode] }
    produces: check-result

  - id: summarize
    needs: [plan, check-result]
    transform: { fn: summarizeAgentFixture }
    produces: summary
