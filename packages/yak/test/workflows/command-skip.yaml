name: command-skip
version: "1"
steps:
  - id: decide
    gate:
      schema:
        inline:
          type: object
          properties:
            decision: { type: string, enum: [approve, reject] }
            notes: { type: string }
          required: [decision]
      render: { inline: "Release?" }
    produces: decision

  - id: release
    needs: [decision]
    skipIf: "decision.decision != 'approve'"
    command: { run: "echo released" }
    produces: release-result
