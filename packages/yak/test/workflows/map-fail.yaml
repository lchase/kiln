name: map-fail
version: "1"
steps:
  - id: items
    transform: { fn: twoItems }
    produces: items

  - id: review
    needs: [items]
    map:
      over: items
      concurrency: 2
      onItemFailure: fail
      step:
        id: review-one
        command:
          run: "if [ \"$MAP_ITEM_INDEX\" = \"1\" ]; then exit 1; else exit 0; fi"
          capture: [exitCode]
    produces: findings
