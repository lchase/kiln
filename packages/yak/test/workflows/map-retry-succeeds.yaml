name: map-retry-succeeds
version: "1"
steps:
  - id: items
    transform: { fn: oneItem }
    produces: items

  - id: review
    needs: [items]
    map:
      over: items
      concurrency: 1
      onItemFailure: retry
      step:
        id: review-one
        command:
          run: >
            n=$(cat counter 2>/dev/null || echo 0);
            n=$((n + 1));
            echo $n > counter;
            if [ $n -lt 2 ]; then exit 1; else exit 0; fi
          capture: [exitCode]
    produces: findings
