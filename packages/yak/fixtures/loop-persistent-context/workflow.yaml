name: loop-persistent-context
version: "1"
steps:
  - id: count-until-four
    loop:
      # Same session every iteration — the point of this fixture. No
      # `needs`/`{{}}` threads the running count between rounds; the
      # agent has to recall its own last answer from conversation
      # history instead.
      freshContext: false
      until: "count.n >= 4"
      budget:
        maxIterations: 5
      onExhausted: fail
      body:
        - id: count
          agent:
            prompt:
              inline: >-
                We're counting up by one, one number per turn, starting
                at 1. If this is the very first turn of our
                conversation, answer 1. Otherwise, recall the number you
                answered on your previous turn and answer that number
                plus one. Answer with only the number, nothing else.
            schema:
              inline:
                type: object
                properties:
                  n: { type: number }
                required: [n]
          produces: count
