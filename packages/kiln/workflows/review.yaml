# Draft review of one pull request, run by yak (@lchase/yak).
#
# The agent returns findings (severity, file, line, suggested comment).
# A person approves or rejects the draft in the Inbox. Approving posts the
# draft as a pull request comment. Kiln does not approve the pull request
# or merge it. Rejecting or revising does not post.
#
# `reviewPrompt` in the kiln config replaces prompts/kiln/review.md.
# The packaged file is the generic default.
#
# `adapter: "mock"` reads `test/fixtures/kiln-review/draft.json` from the checkout.
name: kiln-review
version: "1"
inputSchema:
  inline:
    type: object
    additionalProperties: false
    properties:
      title: { type: string }
      spec: { type: string }
      runNonce: { type: string }
      baseRef: { type: string }
    required: [title, spec, runNonce, baseRef]
steps:
  - id: draft
    needs: [input]
    agent:
      model: opus
      prompt:
        file: prompts/kiln/review.md
      schema:
        inline:
          type: object
          additionalProperties: false
          properties:
            markdown: { type: string, minLength: 1 }
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  severity: { type: string, enum: [note, nit, warning, blocking] }
                  file: { type: string, minLength: 1 }
                  line: { type: integer, minimum: 1 }
                  comment: { type: string, minLength: 1 }
                required: [severity, file, line, comment]
          required: [markdown, findings]
      tools: [Read, Grep, Glob, Bash]
    produces: draft

  - id: approve
    needs: [input, draft]
    gate:
      schema:
        inline:
          type: object
          additionalProperties: false
          properties:
            decision: { type: string, enum: [approve, reject] }
          required: [decision]
      render:
        inline: "Draft review for \"{{input.title}}\"?\n\nApproving posts this draft as a pull request comment. Kiln does not approve the pull request or merge it.\n\n{{draft.markdown}}"
    produces: approval
