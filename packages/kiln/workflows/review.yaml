# Draft review of one pull request, run by yak (@lchase/yak).
#
# The agent returns findings (severity, file, line, suggested comment).
# A person approves or rejects the draft in the Inbox. Approving posts the
# draft as a pull request comment. Kiln does not approve the pull request
# or merge it. Rejecting or revising does not post.
#
# `reviewPrompt` in the kiln config is the overlay file for prompts/kiln/review.md.
# When it is set, that file wins over a local prompts/kiln/review.md and over
# the packaged prompt. Without it, a file in the kiln home prompts/ tree wins.
# The packaged file is the generic default.
#
# The pull request is someone else's code, so the agent has no shell. `diff`
# is a host command step that prints the change, and `draft` reads it from
# the prompt. `KILN_REVIEW_BASE` is the base commit Kiln resolved at launch.
#
# `adapter: "mock"` reads `test/fixtures/kiln-review/draft.json` from the checkout.
name: kiln-review
version: "1"
inputSchema:
  inline:
    type: object
    additionalProperties: false
    properties:
      title: { type: string }
      spec: { type: string }
      runNonce: { type: string }
      baseRef: { type: string }
    required: [title, spec, runNonce, baseRef]
steps:
  # --no-ext-diff and --no-textconv: a .gitattributes in the pull request
  # must not pick a diff driver or a textconv filter from the operator's
  # git config.
  # ponytail: the diff is cut at 200KB. The agent still has Read, Grep, and
  # Glob on the whole tree, and --stat lists every changed file first.
  - id: diff
    needs: [input]
    command:
      run: |
        base="${KILN_REVIEW_BASE:?KILN_REVIEW_BASE is empty}"
        git --no-pager diff --no-ext-diff --no-textconv --no-color --stat "$base...HEAD" -- || exit 1
        git --no-pager diff --no-ext-diff --no-textconv --no-color "$base...HEAD" -- | head -c 200000
      capture: [stdout, stderr, exitCode]
    produces: diff

  - id: draft
    needs: [input, diff]
    agent:
      model: opus
      prompt:
        file: prompts/kiln/review.md
      schema:
        inline:
          type: object
          additionalProperties: false
          properties:
            markdown: { type: string, minLength: 1 }
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  severity: { type: string, enum: [note, nit, warning, blocking] }
                  file: { type: string, minLength: 1 }
                  line: { type: integer, minimum: 1 }
                  comment: { type: string, minLength: 1 }
                required: [severity, file, line, comment]
          required: [markdown, findings]
      tools: [Read, Grep, Glob]
    produces: draft

  - id: approve
    needs: [input, draft]
    gate:
      schema:
        inline:
          type: object
          additionalProperties: false
          properties:
            decision: { type: string, enum: [approve, reject] }
          required: [decision]
      render:
        inline: "Draft review for \"{{input.title}}\"?\n\nApproving posts this draft as a pull request comment. Kiln does not approve the pull request or merge it.\n\n{{draft.markdown}}"
    produces: approval
