name: Publish yak to npm

# Dispatched by release-please.yml right after it cuts a yak release (and
# available manually for recovery). Not triggered by the release tag
# itself — release-please tags with GITHUB_TOKEN, which cannot trigger
# workflows, and the tag is `yak-v*` anyway.
on:
  workflow_dispatch:

# No token by default. Each job asks for what it needs.
permissions: {}

jobs:
  # Installs dependencies and runs their code, so it must not be able to
  # mint the npm publish token: no `id-token` here.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck -w @lchase/yak
      - run: npm test -w @lchase/yak
      - run: npm run build -w @lchase/yak

      - run: npm pack -w @lchase/yak --pack-destination "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Holds the publish token and runs no repository or dependency code: it
  # uploads the tarball the build job made. The `npm-publish` environment is
  # where a required reviewer and a main-only rule go.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >=11.5.1. Pinned, not `latest`.
      - run: npm install -g npm@12.2.3

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: pack

      # The leading ./ matters: npm reads `pack/name.tgz` as a GitHub repo.
      - run: npm publish ./pack/*.tgz --provenance --access public --ignore-scripts
