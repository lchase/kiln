name: Publish to npm

# Dispatched by release-please.yml right after it cuts a kiln release (and
# available manually for recovery). Not triggered by the release tag
# itself — release-please tags with GITHUB_TOKEN, which cannot trigger
# workflows, and the tag is `kiln-v*` anyway.
on:
  workflow_dispatch:

# No token by default. Each job asks for what it needs.
permissions: {}

jobs:
  # Installs dependencies and runs their code, so it must not be able to
  # mint the npm publish token: no `id-token` here.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci
      # Kiln tests read the installed @lchase/yak bundle. The workspace
      # links the source package, which has no dist until it is built.
      - run: npm run build -w @lchase/yak
      - run: npm run typecheck -w @lchase/kiln
      - run: npm test -w @lchase/kiln
      - run: npm run build -w @lchase/kiln

      - run: npm pack -w @lchase/kiln --pack-destination "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Holds the publish token and runs no repository or dependency code: it
  # uploads the tarball the build job made. The `npm-publish` environment is
  # where a required reviewer and a main-only rule go.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >=11.5.1. Pinned, not `latest`.
      - run: npm install -g npm@12.2.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pack

      # The leading ./ matters: npm reads `pack/name.tgz` as a GitHub repo.
      - run: npm publish ./pack/*.tgz --provenance --access public --ignore-scripts
