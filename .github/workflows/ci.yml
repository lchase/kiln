name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel a run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # package.json engines.node is >=22. There is no .nvmrc.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm test` builds @lchase/yak first. Kiln tests read that bundle,
      # and the workspace package has no dist until it is built.
      - name: Test
        run: npm test
